plugins {
    id "idea"
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    // Not applied anywhere: AGP 9 compiles Kotlin itself. Declared so that the Kotlin Gradle
    // plugin on the build classpath has the same version as the serialization plugin.
    alias(libs.plugins.kotlin.android) apply false
    alias(libs.plugins.kotlin.serialization) apply false
    alias(libs.plugins.rikka.refine) apply false
    alias(libs.plugins.rikka.autoresconfig) apply false
    alias(libs.plugins.rikka.materialthemebuilder) apply false
}

idea.module {
    excludeDirs += file("out")
}

subprojects { subproject ->
    plugins.withId("com.android.base") {
        android {
            compileSdk = 37
            buildToolsVersion = "37.0.0"
            ndkVersion = "29.0.13113456"
            defaultConfig {
                minSdk = 24
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
    // Libraries no longer have a target SDK
    plugins.withId("com.android.application") {
        android {
            defaultConfig {
                targetSdk = 37
            }
        }
    }
}

def gitCommitCount = Integer.parseInt("git rev-list --count HEAD".execute([], project.rootDir).text.trim())
def baseVersionName = "13.7.0"
def isBeta = project.hasProperty("beta")
ext {
    versionCode = gitCommitCount
    // Betas carry the commit count so that successive betas of one base version get distinct,
    // ordered version names (and release tags), e.g. 13.7.0.r1520-beta-thedjchi
    versionName = "${baseVersionName}${if (isBeta) ".r${gitCommitCount}-beta" else ""}-thedjchi"
}
