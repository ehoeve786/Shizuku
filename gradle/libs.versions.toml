# The modules of the api submodule are built as part of this project and take their plugin and
# library versions from this catalog, so every alias they use has to be defined here.

[versions]
agp = "9.2.1"
# AGP's built-in Kotlin support uses the Kotlin Gradle plugin found on the build classpath;
# this pins its version (and that of the serialization compiler plugin).
kotlin = "2.2.20"
androidx-annotation = "1.9.1"
androidx-core = "1.16.0"
hidden-api = "4.4.0"
refine = "4.4.0"

[libraries]
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "androidx-annotation" }
androidx-core = { group = "androidx.core", name = "core", version.ref = "androidx-core" }
hidden-compat = { group = "dev.rikka.hidden", name = "compat", version.ref = "hidden-api" }
hidden-stub = { group = "dev.rikka.hidden", name = "stub", version.ref = "hidden-api" }
refine-runtime = { group = "dev.rikka.tools.refine", name = "runtime", version.ref = "refine" }
refine-annotation = { group = "dev.rikka.tools.refine", name = "annotation", version.ref = "refine" }
refine-annotation-processor = { group = "dev.rikka.tools.refine", name = "annotation-processor", version.ref = "refine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
rikka-refine = { id = "dev.rikka.tools.refine", version.ref = "refine" }
rikka-autoresconfig = { id = "dev.rikka.tools.autoresconfig", version = "1.3.0" }
rikka-materialthemebuilder = { id = "dev.rikka.tools.materialthemebuilder", version = "1.6.0" }
