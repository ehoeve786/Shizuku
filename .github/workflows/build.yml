name: Build Debug APK

# Builds the pushed commit so that every branch gets a compile check and an installable APK.
# Release builds are made by app.yml.
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          # versionCode is the commit count
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          ./gradlew :manager:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: shizuku-debug-${{ github.sha }}
          path: manager/build/outputs/apk/debug/*.apk
          if-no-files-found: error
