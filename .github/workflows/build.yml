name: Build APKs

# Builds the pushed commit so that every branch gets a compile check and installable APKs.
# The release variant is built too because it runs R8 and the release-only build steps; without
# signing secrets it is signed with the debug key. Published releases are made by app.yml.
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'
          # versionCode is the commit count
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          ./gradlew :manager:assembleDebug :manager:assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: shizuku-debug-${{ github.sha }}
          path: manager/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK (debug-signed)
        uses: actions/upload-artifact@v6
        with:
          name: shizuku-release-debugsigned-${{ github.sha }}
          path: manager/build/outputs/apk/release/*.apk
          if-no-files-found: error
