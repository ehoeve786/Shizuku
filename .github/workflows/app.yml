name: Build App

on:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Debug'
        type: boolean
        required: false
        default: false

      prerelease:
        description: 'Prerelease'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    env:
      KEYSTORE: ${{ secrets.KEYSTORE }}

    outputs:
      versionName: ${{ steps.buildWithGradle.outputs.versionName }}
      artifactName: ${{ steps.buildWithGradle.outputs.artifactName }}
      sha: ${{ steps.buildWithGradle.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.prerelease && 'beta' || 'master' }}
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Validate Signing Config
        env:
          DEBUG_BUILD: ${{ inputs.debug }}
        run: |
          if [ "$DEBUG_BUILD" = "false" ] && [ "$KEYSTORE" = "" ]; then
            echo "::error::Signing secrets not configured. Signing secrets are required for release builds."
            exit 1
          fi

      - name: Create signing.properties
        if: ${{ !inputs.debug && env.KEYSTORE != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
        run: |
          umask 077
          {
            printf 'KEYSTORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD"
            printf 'KEYSTORE_ALIAS=%s\n' "$KEYSTORE_ALIAS"
            printf 'KEYSTORE_ALIAS_PASSWORD=%s\n' "$KEYSTORE_ALIAS_PASSWORD"
            printf 'KEYSTORE_FILE=../key.jks\n'
          } > signing.properties
          printf '%s' "$KEYSTORE" | base64 --decode > key.jks

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle
        id: buildWithGradle
        env:
          DEBUG_BUILD: ${{ inputs.debug }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          echo 'org.gradle.caching=true' >> gradle.properties
          echo 'org.gradle.parallel=true' >> gradle.properties

          if [ "$DEBUG_BUILD" = "true" ]; then
            TASK=":manager:assembleDebug"
            APK_DIR="manager/build/outputs/apk/debug"
          else
            TASK=":manager:assembleRelease"
            APK_DIR="manager/build/outputs/apk/release"
          fi

          if [ "$PRERELEASE" = "true" ]; then
            ./gradlew "$TASK" -Pbeta
          else
            ./gradlew "$TASK"
          fi
          FILE=$(ls "$APK_DIR"/*.apk)

          VERSION=$(echo "$(basename "$FILE")" | sed -E 's/^shizuku-(.*)-(debug|release)\.apk/\1/')

          ARTIFACT_NAME="shizuku-$VERSION"
          [ "$DEBUG_BUILD" = "true" ] && ARTIFACT_NAME="${ARTIFACT_NAME}-debug"
          ARTIFACT_NAME="${ARTIFACT_NAME}.apk"

          RENAMED="$FILE"
          if [ "$(basename "$FILE")" != "$ARTIFACT_NAME" ]; then
            RENAMED="$(dirname "$FILE")/$ARTIFACT_NAME"
            mv "$FILE" "$RENAMED"
          fi

          echo "versionName=$VERSION" >> $GITHUB_OUTPUT
          echo "artifactName=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "filePath=$RENAMED" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.buildWithGradle.outputs.artifactName }}
          path: ${{ steps.buildWithGradle.outputs.filePath }}

      - name: Attest Build Provenance
        if: ${{ success() && !inputs.debug }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: manager/build/outputs/apk/release/*.apk

  release:
    if: ${{ !inputs.debug }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Tag exactly the commit the APK was built from
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0

      - name: Create Release Tag
        env:
          VERSION: ${{ needs.build.outputs.versionName }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION" -m "Release version $VERSION"
          git push origin "$VERSION"

      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.artifactName }}
          path: files

      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.versionName }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          FLAGS="--draft"
          [ "$PRERELEASE" = "true" ] && FLAGS="$FLAGS --prerelease"
          gh release create "$RELEASE_VERSION" files/*.apk $FLAGS
