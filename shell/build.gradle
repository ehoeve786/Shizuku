import com.android.build.api.artifact.SingleArtifact

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.rikka.refine)
}

android {
    namespace = "rikka.shizuku.shell"
    defaultConfig {
        versionCode = rootProject.ext.versionCode
        versionName = rootProject.ext.versionName
        buildConfigField "String", "MANAGER_APPLICATION_ID", "\"${project(':manager').android.defaultConfig.applicationId}\""
    }
    buildTypes {
        debug {
            multiDexEnabled = false
        }
        release {
            minifyEnabled = true
            proguardFiles "proguard-rules.pro"
        }
    }
    dependenciesInfo {
        includeInApk = false
    }
    lint {
        checkReleaseBuilds = false
    }
    buildFeatures {
        buildConfig = true
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def versionName = rootProject.ext.versionName
        def taskSuffix = variant.name.capitalize()
        def minified = variant.buildType == "release"
        def apkDirectory = variant.artifacts.get(SingleArtifact.APK.INSTANCE)
        def mappingFile = minified ? variant.artifacts.get(SingleArtifact.OBFUSCATION_MAPPING_FILE.INSTANCE) : null
        def assetsDir = new File(rootProject.rootDir, "manager/src/main/assets")
        def mappingDir = new File(rootProject.rootDir, "out/mapping")

        // The manager ships this app's dex as an asset (used by rish). :manager depends on this
        // task, see manager/build.gradle. No outputs are declared on purpose: the target is a
        // source directory of another module.
        def extractDex = tasks.register("extract${taskSuffix}RishDex") {
            inputs.files(apkDirectory)
            if (mappingFile != null) inputs.files(mappingFile)
            doLast {
                def apk = fileTree(apkDirectory.get().asFile).matching { include "*.apk" }.singleFile
                def dex = zipTree(apk).matching { include "classes*.dex" }.singleFile
                copy {
                    from dex
                    into assetsDir
                    rename { "rish_shizuku.dex" }
                }
                if (mappingFile != null) {
                    copy {
                        from mappingFile
                        into mappingDir
                        rename { "cmd-v${versionName}.txt" }
                    }
                }
            }
        }
        tasks.matching { it.name == "assemble${taskSuffix}" }.configureEach {
            finalizedBy(extractDex)
        }
    }
}

dependencies {
    implementation libs.hidden.compat
    compileOnly libs.hidden.stub
}
