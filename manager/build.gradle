def collapseReleaseResourceNames = tasks.register("collapseReleaseResourceNames") {
    def sdkDirectory = androidComponents.sdkComponents.sdkDirectory
    def buildToolsVersion = android.buildToolsVersion
    def zip = layout.buildDirectory.file(
        "intermediates/optimized_processed_res/release/optimizeReleaseResources/resources-release-optimize.ap_")
    def config = file("aapt2-resources.cfg")
    def execOps = services.get(ExecOperations)
    doLast {
        def aapt2 = new File(sdkDirectory.get().asFile, "build-tools/${buildToolsVersion}/aapt2")
        def input = zip.get().asFile
        def optimized = new File("${input}.opt")
        execOps.exec {
            commandLine aapt2, "optimize", "--collapse-resource-names",
                "--resources-config-path", config,
                "-o", optimized, input
            ignoreExitValue = false
        }
        if (optimized.exists()) {
            input.delete()
            optimized.renameTo(input)
        }
    }
}

tasks.matching { it.name == "optimizeReleaseResources" }.configureEach {
    finalizedBy(collapseReleaseResourceNames)
}

// The rish dex is built by :shell and placed into this module's assets
tasks.matching { it.name == "preReleaseBuild" }.configureEach {
    dependsOn(":shell:extractReleaseRishDex")
}
tasks.matching { it.name == "preDebugBuild" }.configureEach {
    dependsOn(":shell:extractDebugRishDex")
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def versionName = rootProject.ext.versionName
        def variantName = variant.name

        variant.outputs.each { output ->
            output.outputFileName.set("shizuku-v${versionName}-${variantName}.apk")
        }

        // Collect the APK and its mapping file of minified builds in <root>/out
        if (variant.buildType == "release") {
            def taskSuffix = variantName.capitalize()
            def copyOutputs = tasks.register("copy${taskSuffix}Outputs", Copy) {
                from(variant.artifacts.get(SingleArtifact.APK.INSTANCE)) {
                    include "*.apk"
                    into "apk"
                }
                from(variant.artifacts.get(SingleArtifact.OBFUSCATION_MAPPING_FILE.INSTANCE)) {
                    into "mapping"
                    rename { "mapping-${versionName}.txt" }
                }
                into new File(rootDir, "out")
            }
            tasks.matching { it.name == "assemble${taskSuffix}" }.configureEach {
                finalizedBy(copyOutputs)
            }
        }
    }
}

